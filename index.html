<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Family dashboard for tasks and rewards">
  <title>Family Dashboard</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--text:#192230;--muted:#738195;--navy:#17243a;--blue:#4f72be;--green:#63b89a;--border:#e5eaf2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{background:var(--navy);color:#fff;padding:26px 16px;display:flex;flex-direction:column}.brand{font-weight:750;padding:0 10px 24px}.brand-mark{display:inline-grid;place-items:center;margin-right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy)}nav{display:grid;gap:6px}nav a{padding:12px;border-radius:10px;color:#c6d0df;text-decoration:none}nav a.active,nav a:hover{background:#ffffff1a;color:white}.profile{margin-top:auto;border-top:1px solid #ffffff30;padding:16px 8px}main{width:100%;max-width:1300px;margin:auto;padding:32px clamp(12px,4vw,40px) 48px;min-width:0}.topbar,.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topbar{margin-bottom:22px}h1{font:clamp(26px,3vw,34px) Georgia,serif;margin:0}.date{color:var(--muted);font-size:14px;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(14px,2vw,20px);margin-bottom:18px}.member-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.member{border:1px solid var(--border);border-top:4px solid var(--member);border-radius:10px;padding:14px;background:var(--member-bg)}.points{color:var(--member);font-weight:700}.task-list{display:grid;gap:0}.task{display:grid;grid-template-columns:26px minmax(120px,1fr) 80px minmax(120px,160px) minmax(190px,240px);gap:10px;align-items:center;border-top:1px solid var(--border);padding:12px 0;min-width:0}.task:first-child{margin-top:8px}.task label{overflow-wrap:anywhere}.task input,.task select{min-width:0;width:100%;padding:8px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font:inherit}.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--member);justify-self:center}.task .assignee{border-left:4px solid var(--member)}.task-date-time{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0}.points-input{max-width:72px}.task-points{white-space:nowrap}.task.done label{text-decoration:line-through;color:var(--muted)}.progress{height:7px;background:var(--border);border-radius:8px;margin:14px 0;overflow:hidden}.progress div{height:100%;background:var(--green);width:0;transition:width .2s}.progress-label{color:var(--muted);font-size:13px}.button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 14px;text-decoration:none;cursor:pointer;font:inherit;font-weight:650}.form-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.form-row label{display:grid;gap:5px;color:var(--muted);font-size:13px}.form-row input,.form-row select{max-width:100%;min-width:0;padding:9px;border:1px solid var(--border);border-radius:7px;font:inherit}.message,.history{color:var(--muted);font-size:13px}
    /* Tablet: task rows use two compact lines to avoid cramped date/time controls. */
    @media(max-width:1050px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:16px 7px}.brand{padding:0 0 16px;text-align:center}.brand span:not(.brand-mark),.profile{display:none}nav a{padding:12px 4px;text-align:center;font-size:0}.member-list{grid-template-columns:repeat(2,minmax(0,1fr))}.task{grid-template-columns:26px minmax(0,1fr) 76px minmax(140px,1fr);row-gap:8px;padding:12px 4px}.task label{grid-column:2}.task-points{grid-column:3;grid-row:1}.task .assignee{grid-column:4;grid-row:1}.task-date-time{grid-column:2/5;grid-row:2;max-width:420px}.task input[type=checkbox]{grid-column:1;grid-row:1}}
    /* Phones: persistent bottom nav and touch-friendly stacked task cards. */
    @media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:20;left:0;right:0;bottom:0;height:auto;min-height:64px;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));display:block}.brand,.profile{display:none}nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}nav a{height:52px;padding:5px 2px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.1;white-space:normal;overflow-wrap:anywhere;border-radius:7px}main{padding:20px 10px calc(88px + env(safe-area-inset-bottom))}.topbar{align-items:flex-start}.member-list{gap:7px}.member{padding:10px}.task{grid-template-columns:26px minmax(0,1fr) 76px;gap:7px;margin:0;padding:12px 8px;border:1px solid var(--border);border-left:4px solid var(--member);border-radius:10px;background:linear-gradient(110deg,var(--member-bg),#fff 70%)}.task+.task{margin-top:9px}.task input[type=checkbox]{grid-column:1;grid-row:1}.task label{grid-column:2;grid-row:1;align-self:center}.task-points{grid-column:3;grid-row:1;justify-self:end}.task .assignee{grid-column:2/4;grid-row:2}.task-date-time{grid-column:2/4;grid-row:3;width:100%;max-width:none}.task-date-time input{min-height:42px}.task input,.task select{font-size:16px}.card-header{align-items:center}.form-row{align-items:stretch}.form-row label{flex:1 1 145px}.form-row input,.form-row select{width:100%;min-height:42px}}
    @media(max-width:380px){nav a{font-size:9px}main{padding-inline:7px}.task{grid-template-columns:24px minmax(0,1fr) 65px;gap:5px;padding:10px 6px}.member{font-size:14px}.form-row>*{width:100%}.form-row label{width:100%}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">⌂</span><span>Family</span></div>
    <nav aria-label="Main navigation"><a class="active" href="index.html">◫ Dashboard</a><a href="calendar.html">▦ Calendar</a><a href="#tasks">✓ Tasks</a><a href="rewards.html">★ Rewards</a></nav>
    <div class="profile"><strong>Arun</strong><br>Parent</div>
  </aside>
  <main>
    <header class="topbar"><div><h1>Good morning, Arun</h1><div class="date"><time id="current-date"></time> · <time id="current-time"></time></div></div><a class="button" href="calendar.html">Open calendar</a></header>
    <section class="card"><div class="card-header"><h2>Family</h2></div><div class="member-list" id="member-list"></div></section>
    <section class="card" id="tasks"><div class="card-header"><h2>Family Tasks</h2><button class="button" id="add-task">+ Add task</button></div><p class="date">Tasks, stars, dates, and assignees are shared with the family calendar.</p><div class="progress"><div id="progress-bar"></div></div><div class="progress-label" id="progress-label"></div><div class="task-list" id="task-list"></div></section>
    <section class="card"><div class="card-header"><h2>Redeem stars</h2><a class="button" href="rewards.html">Manage rewards</a></div><form class="form-row" id="redeem-form"><label>Family member<select id="redeem-member"></select></label><label>Reward<input id="reward-name" placeholder="Choose a reward" required></label><label>Star cost<input id="reward-cost" type="number" min="1" value="10" required></label><button class="button">Redeem</button></form><p class="message" id="message" role="status"></p><ul class="history" id="history"></ul></section>
  </main>
</div>
<script>
const KEY='family-dashboard-rewards-v1',MEMBERS=[{name:'Arun',color:'#4f72be',status:'Parent'},{name:'Jaisy',color:'#d55f91',status:'Parent'},{name:'Joanna',color:'#2f9d72',status:'Home'},{name:'Joshua',color:'#d97706',status:'School'}],byName=Object.fromEntries(MEMBERS.map(m=>[m.name,m])),defaults=[['kitchen','Clean the kitchen','08:30'],['groceries','Order groceries','10:00'],['plants','Water the plants','15:30'],['dentist','Schedule dentist appointment','18:00']];const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function read(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.points&&s.tasks)return s}catch(e){console.warn(e)}return{points:Object.fromEntries(MEMBERS.map(m=>[m.name,0])),tasks:{},history:[]}}const state=read();MEMBERS.forEach(m=>state.points[m.name]=Math.max(0,Number(state.points[m.name])||0));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn(e)}}function style(n){const p=byName[n]||MEMBERS[0];return `--member:${p.color};--member-bg:${p.color}18`}
function renderMembers(){const box=document.getElementById('member-list');box.replaceChildren();MEMBERS.forEach(m=>{const c=document.createElement('div');c.className='member';c.style.cssText=style(m.name);const name=document.createElement('strong');name.textContent=m.name;const status=document.createElement('div');status.className='date';status.textContent=m.status;const stars=document.createElement('div');stars.className='points';stars.textContent=`★ ${state.points[m.name]||0} stars`;c.append(name,status,stars);box.append(c)})}
function progress(){const rows=[...document.querySelectorAll('.task')],done=rows.filter(r=>r.querySelector('[type=checkbox]').checked).length;document.getElementById('progress-bar').style.width=(rows.length?Math.round(done/rows.length*100):0)+'%';document.getElementById('progress-label').textContent=`${done} of ${rows.length} tasks complete`}
function saveTask(row){const c=state.tasks[row.dataset.id]||{};c.title=row.querySelector('label').textContent;c.completed=row.querySelector('[type=checkbox]').checked;c.points=Math.max(1,Number(row.querySelector('.points-input').value)||1);c.assignee=row.querySelector('.assignee').value;c.date=row.querySelector('.task-date').value;c.time=row.querySelector('.task-time').value||'09:00';state.tasks[row.dataset.id]=c;save()}
function makeTask(id,title,time='09:00'){const c=state.tasks[id]||{},row=document.createElement('div');row.className='task';row.dataset.id=id;row.style.cssText=style(c.assignee||'Arun');const check=document.createElement('input');check.type='checkbox';check.checked=!!c.completed;check.setAttribute('aria-label',`Mark ${title} complete`);const label=document.createElement('label');label.textContent=c.title||title;const value=document.createElement('span');value.className='task-points';value.innerHTML=`<input class="points-input" type="number" min="1" max="1000" value="${c.points||10}" aria-label="Star value"> ★`;const assignee=document.createElement('select');assignee.className='assignee';assignee.setAttribute('aria-label',`Assignee for ${title}`);MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;assignee.append(o)});assignee.value=c.assignee||'Arun';const dt=document.createElement('span');dt.className='task-date-time';const date=document.createElement('input');date.className='task-date';date.type='date';date.value=c.date||today();date.setAttribute('aria-label',`Date for ${title}`);const tm=document.createElement('input');tm.className='task-time';tm.type='time';tm.value=c.time||time;tm.setAttribute('aria-label',`Time for ${title}`);dt.append(date,tm);row.append(check,label,value,assignee,dt);row.classList.toggle('done',check.checked);check.addEventListener('change',()=>{const stars=Math.max(1,Number(value.querySelector('input').value)||1);if(check.checked&&!c.completed)state.points[assignee.value]=(state.points[assignee.value]||0)+stars;else if(!check.checked&&c.completed)state.points[assignee.value]=Math.max(0,(state.points[assignee.value]||0)-stars);c.completed=check.checked;state.tasks[id]=c;save();renderMembers();row.classList.toggle('done',check.checked);progress()});assignee.addEventListener('change',()=>{row.style.cssText=style(assignee.value);saveTask(row)});row.querySelectorAll('input:not([type=checkbox])').forEach(x=>x.addEventListener('change',()=>saveTask(row)));return row}
function renderTasks(){const list=document.getElementById('task-list');list.replaceChildren();defaults.forEach(([id,title,time])=>list.append(makeTask(id,title,time)));Object.entries(state.tasks).filter(([id])=>!defaults.some(d=>d[0]===id)).forEach(([id,t])=>list.append(makeTask(id,t.title||id,t.time||'09:00')));progress()}
function renderHistory(){const ul=document.getElementById('history');ul.replaceChildren();(state.history||[]).slice(-5).reverse().forEach(x=>{const li=document.createElement('li');li.textContent=`${x.member} redeemed ${x.reward} for ${x.cost} stars`;ul.append(li)})}function updateClock(){const d=new Date();document.getElementById('current-date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('current-time').textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
const select=document.getElementById('redeem-member');MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;select.append(o)});document.getElementById('add-task').onclick=()=>{const title=prompt('What task would you like to add?');if(!title?.trim())return;const id='task-'+Date.now();state.tasks[id]={title:title.trim(),date:today(),time:'09:00',points:10,assignee:'Arun',completed:false};save();renderTasks()};document.getElementById('redeem-form').onsubmit=e=>{e.preventDefault();const n=select.value,reward=document.getElementById('reward-name').value.trim(),cost=Number(document.getElementById('reward-cost').value);if(!reward||!Number.isInteger(cost)||cost<1)return;if((state.points[n]||0)<cost){document.getElementById('message').textContent=`${n} needs ${cost-state.points[n]} more stars`;return}state.points[n]-=cost;state.history=state.history||[];state.history.push({member:n,reward,cost});save();renderMembers();renderHistory();document.getElementById('message').textContent=`${n} redeemed ${reward}`;document.getElementById('reward-name').value=''};renderMembers();renderTasks();renderHistory();updateClock();setInterval(updateClock,1000);
</script></body></html>
