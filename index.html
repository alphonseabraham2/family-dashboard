<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Family dashboard for members and rewards"><title>Family Dashboard</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--text:#192230;--muted:#738195;--navy:#17243a;--blue:#4f72be;--border:#e5eaf2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{background:var(--navy);color:#fff;padding:26px 16px;display:flex;flex-direction:column}.brand{font-weight:750;padding:0 10px 24px}.brand-mark{display:inline-grid;place-items:center;margin-right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy)}nav{display:grid;gap:6px}nav a{padding:12px;border-radius:10px;color:#c6d0df;text-decoration:none}nav a.active,nav a:hover{background:#ffffff1a;color:#fff}.profile{margin-top:auto;border-top:1px solid #ffffff30;padding:16px 8px}main{width:100%;max-width:1300px;margin:auto;padding:32px clamp(12px,4vw,40px) 48px;min-width:0}.topbar,.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topbar{margin-bottom:22px}h1{font:clamp(26px,3vw,34px) Georgia,serif;margin:0}.date{color:var(--muted);font-size:14px;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(14px,2vw,20px);margin-bottom:18px}.card h2{font-size:17px;margin:0}.member-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.member{border:1px solid var(--border);border-top:4px solid var(--member);border-radius:10px;padding:14px;background:var(--member-bg)}.points{color:var(--member);font-weight:700}.button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 14px;text-decoration:none;cursor:pointer}.form-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.form-row label{display:grid;gap:5px;color:var(--muted);font-size:13px}.form-row input,.form-row select{padding:9px;border:1px solid var(--border);border-radius:7px}.message,.history{color:var(--muted);font-size:13px}
@media(max-width:1050px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:16px 7px}.brand{padding:0 0 16px;text-align:center}.brand span:not(.brand-mark),.profile{display:none}nav a{padding:12px 4px;text-align:center;font-size:0}.member-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:20;left:0;right:0;bottom:0;height:auto;min-height:64px;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));display:block}.brand,.profile{display:none}nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}nav a{height:52px;padding:5px 2px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;border-radius:7px}main{padding:20px 10px calc(88px + env(safe-area-inset-bottom))}.member-list{gap:7px}.member{padding:10px}.form-row>*{width:100%}.form-row label{width:100%}}
@media(max-width:380px){nav a{font-size:9px}main{padding-inline:7px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">⌂</span><span>Family</span></div><nav aria-label="Main navigation"><a class="active" href="index.html">◫ Dashboard</a><a href="calendar.html">▦ Calendar</a><a href="tasks.html">✓ Tasks</a><a href="rewards.html">★ Rewards</a></nav><div class="profile"><strong>Arun</strong><br>Parent</div></aside>
  <main>
    <header class="topbar"><div><h1>Good morning, Arun</h1><div class="date"><time id="current-date"></time> · <time id="current-time"></time></div></div><a class="button" href="tasks.html">Open tasks</a></header>
    <section class="card"><div class="card-header"><h2>Family</h2></div><div class="member-list" id="member-list"></div></section>
    <section class="card"><div class="card-header"><h2>Redeem stars</h2><a class="button" href="rewards.html">Manage rewards</a></div><form class="form-row" id="redeem-form"><label>Family member<select id="redeem-member"></select></label><label>Reward<input id="reward-name" placeholder="Choose a reward" required></label><label>Star cost<input id="reward-cost" type="number" min="1" value="10" required></label><button class="button">Redeem</button></form><p class="message" id="message" role="status"></p><ul class="history" id="history"></ul></section>
  </main>
</div>
<script>
const KEY='family-dashboard-rewards-v1',MEMBERS=[{name:'Arun',color:'#4f72be',status:'Parent'},{name:'Jaisy',color:'#d55f91',status:'Parent'},{name:'Joanna',color:'#2f9d72',status:'Home'},{name:'Joshua',color:'#d97706',status:'School'}],byName=Object.fromEntries(MEMBERS.map(m=>[m.name,m])),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function read(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.points&&s.tasks)return s}catch(e){console.warn(e)}return{points:Object.fromEntries(MEMBERS.map(m=>[m.name,0])),tasks:{},history:[]}}const state=read();MEMBERS.forEach(m=>state.points[m.name]=Math.max(0,Number(state.points[m.name])||0));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn(e)}}function style(n){const p=byName[n]||MEMBERS[0];return `--member:${p.color};--member-bg:${p.color}18`}function renderMembers(){const box=document.getElementById('member-list');box.replaceChildren();MEMBERS.forEach(m=>{const c=document.createElement('div');c.className='member';c.style.cssText=style(m.name);c.innerHTML=`<strong>${m.name}</strong><div class="date">${m.status}</div><div class="points">★ ${state.points[m.name]||0} stars</div>`;box.append(c)})}function renderHistory(){const ul=document.getElementById('history');ul.replaceChildren();(state.history||[]).slice(-5).reverse().forEach(x=>{const li=document.createElement('li');li.textContent=`${x.member} redeemed ${x.reward} for ${x.cost} stars`;ul.append(li)})}function clock(){const d=new Date();document.getElementById('current-date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('current-time').textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}const select=document.getElementById('redeem-member');MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;select.append(o)});document.getElementById('redeem-form').onsubmit=e=>{e.preventDefault();const n=select.value,reward=document.getElementById('reward-name').value.trim(),cost=Number(document.getElementById('reward-cost').value);if(!reward||cost<1)return;if((state.points[n]||0)<cost){document.getElementById('message').textContent=`${n} needs ${cost-state.points[n]} more stars`;return}state.points[n]-=cost;state.history=state.history||[];state.history.push({member:n,reward,cost});save();renderMembers();renderHistory();document.getElementById('reward-name').value='';document.getElementById('message').textContent=`${n} redeemed ${reward}`};renderMembers();renderHistory();clock();setInterval(clock,1000);
</script></body></html>
