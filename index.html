<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Dashboard</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--text:#192230;--muted:#738195;--navy:#17243a;--border:#e5eaf2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:800;padding:0 10px 28px}.brand-mark{display:inline-grid;place-items:center;margin-right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy)}nav{display:grid;gap:6px}nav a{padding:12px 14px;border-radius:10px;color:#b9c4d4;text-decoration:none}nav a.active,nav a:hover{background:#ffffff1a;color:#fff}.profile{margin-top:auto;border-top:1px solid #ffffff20;padding:16px 8px 0}.profile small{display:block;color:#9facbf;margin-top:3px}main{width:100%;max-width:1250px;margin:auto;padding:34px 38px 48px}.topbar,.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar{margin-bottom:24px}h1{font:32px Georgia,serif;margin:0}.date{color:var(--muted);font-size:14px;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 6px 18px #28375008}.card h2{font-size:17px;margin:0}.button{border:0;border-radius:8px;padding:10px 14px;background:#4f72be;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.member-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.member{border:1px solid var(--border);border-top:4px solid var(--member);border-radius:10px;padding:14px;background:linear-gradient(135deg,var(--member-bg),#fff 75%)}.member strong{display:block}.member-status{font-size:12px;color:var(--muted);margin-top:5px}.points{color:var(--member);font-weight:800;margin-top:8px}.task{display:grid;grid-template-columns:20px minmax(140px,1fr) 70px 130px 140px;gap:10px;align-items:center;border-top:1px solid var(--border);padding:12px 0}.task:first-of-type{margin-top:12px}.task.done label{text-decoration:line-through;color:var(--muted)}.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--member)}.assignee{border-left:4px solid var(--member)!important}.task input,.task select{min-width:0;padding:7px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text)}.points-input{width:64px}.task-date{width:95px}.task-time{width:82px}.progress{height:7px;background:var(--border);border-radius:9px;overflow:hidden;margin:16px 0}.progress div{height:100%;background:#63b89a;width:0;transition:width .2s}.progress-label{font-size:13px;color:var(--muted);margin-top:10px}.form-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:14px}.form-row label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.form-row input,.form-row select{padding:7px;border:1px solid var(--border);border-radius:7px}.message{min-height:20px;color:var(--muted);font-size:13px}.history{font-size:13px;color:var(--muted)}@media(max-width:850px){.app{grid-template-columns:74px 1fr}.brand span,.profile div{display:none}.brand{text-align:center;padding-inline:0}nav a{font-size:0;text-align:center}.member-list{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.app{display:block}.sidebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:65px;padding:7px;display:block}.brand,.profile{display:none}nav{grid-template-columns:repeat(3,1fr)}nav a{padding:12px 4px;height:50px;text-align:center}main{padding:24px 12px 82px}.member-list{grid-template-columns:1fr 1fr}.task{grid-template-columns:20px 1fr 62px;gap:7px}.task select{grid-column:2}.task-date-time{grid-column:2/4}.topbar h1{font-size:26px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">⌂</span><span>Family</span></div>
    <nav><a class="active" href="index.html">◫ &nbsp; Dashboard</a><a href="calendar.html">▦ &nbsp; Calendar</a><a href="#tasks">✓ &nbsp; Tasks</a></nav>
    <div class="profile"><strong>Arun</strong><small>Parent</small></div>
  </aside>
  <main>
    <header class="topbar"><div><h1>Good morning, Arun</h1><div class="date"><time id="current-date"></time> · <time id="current-time"></time></div></div><a class="button" href="calendar.html">Open calendar</a></header>
    <section class="card"><div class="card-header"><h2>Family</h2></div><div class="member-list" id="member-list"></div></section>
    <section class="card" id="tasks"><div class="card-header"><h2>Family Tasks</h2><button class="button" id="add-task">+ Add task</button></div><p class="date">Each family member has a color throughout tasks and the calendar.</p><div class="progress"><div id="progress-bar"></div></div><div class="progress-label" id="progress-label"></div><div id="task-list"></div></section>
    <section class="card"><div class="card-header"><h2>Redeem stars</h2></div><form class="form-row" id="redeem-form"><label>Family member<select id="redeem-member"></select></label><label>Reward<input id="reward-name" maxlength="80" required></label><label>Star cost<input id="reward-cost" type="number" min="1" value="10" required></label><button class="button">Redeem</button></form><p class="message" id="message"></p><ul class="history" id="history"></ul></section>
  </main>
</div>
<script>
const KEY='family-dashboard-rewards-v1';
const MEMBERS=[
  {name:'Arun',color:'#4f72be',status:'Parent'},
  {name:'Jaisy',color:'#d55f91',status:'Parent'},
  {name:'Joanna',color:'#2f9d72',status:'Home'},
  {name:'Joshua',color:'#d97706',status:'School'}
];
const memberByName=Object.fromEntries(MEMBERS.map(m=>[m.name,m]));
const defaults=[['kitchen','Clean the kitchen','08:30'],['groceries','Order groceries','10:00'],['plants','Water the plants','15:30'],['dentist','Schedule dentist appointment','18:00']];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function read(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.points&&s?.tasks)return s}catch(e){console.warn(e)}return{points:Object.fromEntries(MEMBERS.map(m=>[m.name,0])),tasks:{},history:[]}}
const state=read();MEMBERS.forEach(m=>state.points[m.name]=Math.max(0,Number(state.points[m.name])||0));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function memberStyle(name){const m=memberByName[name]||MEMBERS[0];return `--member:${m.color};--member-bg:${m.color}18`}
function renderMembers(){const box=document.getElementById('member-list');box.replaceChildren();MEMBERS.forEach(m=>{const card=document.createElement('div');card.className='member';card.style.cssText=memberStyle(m.name);card.innerHTML=`<strong>${m.name}</strong><div class="member-status">${m.status}</div><div class="points">★ ${state.points[m.name]||0} stars</div>`;box.append(card)})}
function saveTask(row){const id=row.dataset.id,c=state.tasks[id]||{};c.title=row.querySelector('label').textContent;c.completed=row.querySelector('[type=checkbox]').checked;c.points=Number(row.querySelector('.points-input').value)||1;c.assignee=row.querySelector('.assignee').value;c.date=row.querySelector('.task-date').value;c.time=row.querySelector('.task-time').value||'09:00';state.tasks[id]=c;save()}
function updateProgress(){const rows=[...document.querySelectorAll('.task')],done=rows.filter(r=>r.querySelector('[type=checkbox]').checked).length;const pct=rows.length?Math.round(done/rows.length*100):0;document.getElementById('progress-bar').style.width=pct+'%';document.getElementById('progress-label').textContent=`${done} of ${rows.length} tasks complete`}
function makeTask(id,title,time='09:00'){const c=state.tasks[id]||{};const row=document.createElement('div');row.className='task';row.dataset.id=id;row.style.cssText=memberStyle(c.assignee||'Arun');const check=document.createElement('input');check.type='checkbox';check.checked=!!c.completed;check.setAttribute('aria-label','Mark '+title+' complete');const label=document.createElement('label');label.textContent=c.title||title;const points=document.createElement('span');points.innerHTML='<input class="points-input" type="number" min="1" value="'+(c.points||10)+'" aria-label="Star value"> ★';const select=document.createElement('select');select.className='assignee';MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;select.append(o)});select.value=c.assignee||'Arun';const dateTime=document.createElement('span');dateTime.className='task-date-time';const date=document.createElement('input');date.className='task-date';date.type='date';date.value=c.date||today();const timeInput=document.createElement('input');timeInput.className='task-time';timeInput.type='time';timeInput.value=c.time||time;dateTime.append(date,timeInput);row.append(check,label,points,select,dateTime);row.classList.toggle('done',check.checked);check.addEventListener('change',()=>{if(check.checked&&!c.completed){const n=Math.max(1,Number(points.querySelector('input').value)||1);state.points[select.value]=(state.points[select.value]||0)+n;c.completed=true}else if(!check.checked&&c.completed){const n=Math.max(1,Number(points.querySelector('input').value)||1);state.points[select.value]=Math.max(0,(state.points[select.value]||0)-n);c.completed=false}c.completed=check.checked;state.tasks[id]=c;save();renderMembers();row.classList.toggle('done',check.checked);updateProgress()});select.addEventListener('change',()=>{row.style.cssText=memberStyle(select.value);saveTask(row)});[...row.querySelectorAll('input:not([type=checkbox])')].forEach(el=>el.addEventListener('change',()=>saveTask(row)));return row}
function renderTasks(){const list=document.getElementById('task-list');list.replaceChildren();defaults.forEach(([id,title,time])=>list.append(makeTask(id,title,time)));Object.entries(state.tasks).filter(([id])=>!defaults.some(d=>d[0]===id)).forEach(([id,c])=>list.append(makeTask(id,c.title||'New task',c.time||'09:00')));updateProgress()}
function updateClock(){const d=new Date();document.getElementById('current-date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);document.getElementById('current-time').textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}).format(d)}
const memberSelect=document.getElementById('redeem-member');MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;memberSelect.append(o)});
document.getElementById('add-task').addEventListener('click',()=>{const title=prompt('What task would you like to add?');if(!title?.trim())return;const id='task-'+Date.now();state.tasks[id]={title:title.trim(),date:today(),time:'09:00',points:10,assignee:'Arun',completed:false,awarded:false};save();renderTasks()});
document.getElementById('redeem-form').addEventListener('submit',e=>{e.preventDefault();const name=memberSelect.value,reward=document.getElementById('reward-name').value.trim(),cost=Number(document.getElementById('reward-cost').value),msg=document.getElementById('message');if(!reward||cost<1)return;if((state.points[name]||0)<cost){msg.textContent=`${name} needs ${cost-(state.points[name]||0)} more stars`;return}state.points[name]-=cost;state.history=(state.history||[]);state.history.push({member:name,reward,cost,date:new Date().toISOString()});save();renderMembers();document.getElementById('reward-name').value='';msg.textContent=`${name} redeemed ${reward}`;renderHistory()});
function renderHistory(){const ul=document.getElementById('history');ul.replaceChildren();(state.history||[]).slice(-5).reverse().forEach(x=>{const li=document.createElement('li');li.textContent=`${x.member} redeemed ${x.reward} for ${x.cost} stars`;ul.append(li)})}
renderMembers();renderTasks();renderHistory();updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
