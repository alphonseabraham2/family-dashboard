<!DOCTYPE html>
<html lang="en">
<head>
  <script src="sync.js"></script>
  <script src="common.js"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Family dashboard: daily routines, stars and rewards"><title>Family Dashboard</title>
  <style>
    :root{--bg:#eef1f6;--card:#fff;--text:#192230;--muted:#8592a5;--blue:#4f72be;--border:#e3e8f0;--shadow:0 1px 3px #1b2a4a14,0 4px 12px #1b2a4a0d;--track:#dfe5ee;--ink:#17243a}
    body.dark{--bg:#101826;--card:#1a2436;--text:#e8edf5;--muted:#8d9bb2;--border:#27344b;--shadow:0 1px 3px #0006;--track:#2b3a54;--ink:#e8edf5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:100%;max-width:1400px;margin:auto;padding:24px clamp(12px,3vw,32px) 110px;min-width:0}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    h1{font:clamp(24px,3vw,32px) Georgia,serif;margin:0}
    .date{color:var(--muted);font-size:13px;margin-top:6px}
    .chip{border:1px solid var(--border);background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
    .col{display:flex;flex-direction:column;gap:10px;min-width:0}
    .mhead{background:var(--member-bg);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
    .mtop{display:flex;align-items:center;gap:10px}
    .avatar{width:38px;height:38px;border-radius:50%;background:var(--member);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
    .mname{font-weight:700;font-size:16px;line-height:1.1}
    .msub{font-size:11px;color:var(--muted);margin-top:2px}
    .mood{margin-left:auto;font-size:20px}
    .mstats{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;font-weight:700;flex-wrap:wrap}
    .mstats .star{color:#d49b00}.mstats .fire{color:#e8590c}
    .bar{flex:1;min-width:40px;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
    .bar i{display:block;height:100%;background:var(--member);width:0;transition:width .3s}
    .bar.tasks{flex:none;margin-top:10px}
    .goal{color:var(--text);text-decoration:none;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ready{font-size:11px;font-weight:600;color:var(--member)}
    .section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
    .section.now{outline:2px solid color-mix(in srgb,var(--member) 45%,transparent)}
    .shead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:2px 2px 8px}
    .shead .count{margin-left:auto;letter-spacing:0;font-weight:600}
    .now-badge{background:var(--member);color:#fff;border-radius:99px;padding:1px 7px;font-size:9px;letter-spacing:.04em}
    .task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:11px;padding:9px 10px;margin-bottom:7px;cursor:pointer;font:inherit}
    .task:last-child{margin-bottom:0}.task:hover{border-color:var(--member)}
    .ticon{width:34px;height:34px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-size:18px;flex:none;box-shadow:var(--shadow)}
    .tname{font-weight:650;font-size:14px;line-height:1.15}
    .tsub{font-size:11px;color:var(--muted);margin-top:2px}
    .streak{margin-left:auto;font-size:12px;font-weight:700;color:#e8590c;white-space:nowrap}
    .pts{margin-left:auto;font-size:11px;font-weight:800;border-radius:99px;padding:2px 7px;background:color-mix(in srgb,var(--member) 18%,var(--card));color:var(--member)}
    .pts.neg{background:#d6454522;color:#d64545}
    .pts+.streak{margin-left:0}
    .task.done{background:color-mix(in srgb,var(--member) 14%,var(--card));border-color:var(--member)}
    .task.done .tname{text-decoration:line-through;opacity:.65}
    .task.done .ticon::after{content:"✓";position:absolute;font-size:22px;color:var(--member);font-weight:800}
    .task.done .ticon{position:relative;color:transparent;text-shadow:none}
    .edit{font-size:12px;color:var(--muted);text-align:center;padding:6px;text-decoration:none;display:block}
    .edit:hover{color:var(--member)}
    @media(max-width:1050px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.board{grid-template-columns:minmax(0,1fr)}}
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <div><h1 id="greeting">Good morning</h1><div class="date"><time id="current-date"></time> · <time id="current-time"></time></div></div>
    <span class="chip">Day</span>
  </header>
  <div class="board" id="board"></div>
</main>
<nav id="tabbar"></nav>

<script>
const {MEMBERS,SECTIONS,esc,signed}=FH;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const nowSection=()=>{const h=new Date().getHours();return h<12?'Morning':h<17?'Afternoon':'Evening'};
const mstyle=m=>`--member:${m.color};--member-bg:${m.color}18`;

function render(){
  const s=FH.state,log=FH.logRead(),board=document.getElementById('board');board.replaceChildren();
  MEMBERS.forEach(m=>{
    const col=el('div','col');col.style.cssText=mstyle(m);
    const items=s.routines.filter(r=>r.member===m.name),done=items.filter(r=>FH.doneToday(r.id,log)).length;
    const best=Math.max(0,...items.map(r=>FH.streak(r.id,log))),pts=s.points[m.name]||0;
    const g=(s.rewards[m.name]||[]).find(r=>r.id===s.goals[m.name]);
    const goalHtml=g?`<a class="goal" href="rewards.html" title="${esc(g.name)}">${esc(g.icon||'🎯')} ${esc(g.name)}</a><div class="bar"><i style="width:${Math.max(0,Math.min(100,pts/g.stars*100))}%"></i></div><span class="ready">${pts>=g.stars?'ready!':(g.stars-pts)+' to go'}</span>`:`<a class="goal" href="rewards.html">Set a goal</a>`;
    col.append(el('div','mhead',`<div class="mtop"><div class="avatar">${esc(m.name[0])}</div><div><div class="mname">${esc(m.name)}</div><div class="msub">${done}/${items.length} done today · ${esc(m.status)}</div></div><span class="mood">${m.mood}</span></div>
      <div class="bar tasks"><i style="width:${items.length?done/items.length*100:0}%"></i></div>
      <div class="mstats"><span class="star">★ ${pts<0?'−'+Math.abs(pts):pts}</span><span class="fire">🔥 ${best}</span>${goalHtml}</div>`));
    SECTIONS.forEach(sec=>{
      const list=items.filter(r=>r.section===sec);if(!list.length)return;
      const sd=list.filter(r=>FH.doneToday(r.id,log)).length,isNow=sec===nowSection();
      const box=el('div','section'+(isNow?' now':''));
      box.append(el('div','shead',`${sec}${isNow?'<span class="now-badge">NOW</span>':''}<span class="count">${sd}/${list.length}</span>`));
      list.forEach(r=>{
        const isDone=FH.doneToday(r.id,log),k=FH.streak(r.id,log),pen=Number(r.penalty)||0,p=Number(r.points)||0;
        const sub=[r.sub,pen>0?`−${pen} if missed`:''].filter(Boolean).join(' · ');
        const b=el('button','task'+(isDone?' done':''),`<span class="ticon">${esc(r.icon||'✅')}</span><span><div class="tname">${esc(r.name)}</div>${sub?`<div class="tsub">${esc(sub)}</div>`:''}</span>${p!==1?`<span class="pts${p<0?' neg':''}">${signed(p)}</span>`:''}${k?`<span class="streak">🔥${k}</span>`:''}`);
        b.type='button';b.setAttribute('aria-pressed',isDone);b.onclick=()=>{FH.toggleRoutine(r.id);render()};box.append(b)});
      col.append(box)});
    const edit=el('a','edit',`⚙ Edit ${esc(m.name)}'s routine`);edit.href=`tasks.html#${encodeURIComponent(m.name)}`;col.append(edit);
    board.append(col)})}

function clock(){const d=new Date(),h=d.getHours();
  document.getElementById('current-date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('current-time').textContent=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  document.getElementById('greeting').textContent=`Good ${h<12?'morning':h<17?'afternoon':'evening'}`}

FH.mountTabbar('today',{plus:()=>{location.href='tasks.html#add'},plusLabel:'Add a routine'});
FH.onChange(()=>{FH.load();render()});
render();clock();setInterval(clock,1000);
</script>
</body>
</html>
