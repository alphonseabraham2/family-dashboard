<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Family dashboard for tasks and rewards">
  <title>Family Dashboard</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#192230;--muted:#738195;--navy:#17243a;--blue:#4f72be;--green:#63b89a;--border:#e7ecf3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:750;padding:0 10px 28px}.brand-mark{display:inline-grid;place-items:center;margin-right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy)}nav{display:grid;gap:6px}nav a{padding:12px 14px;border-radius:10px;color:#b9c4d4;text-decoration:none}nav a.active,nav a:hover{background:#ffffff1a;color:#fff}.profile{margin-top:auto;border-top:1px solid #ffffff20;padding:16px 8px 0}.profile small{display:block;color:#9facbf;margin-top:3px}main{padding:34px 38px 48px;max-width:1250px;width:100%;margin:auto}.topbar,.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar{margin-bottom:24px}h1{font:32px Georgia,serif;margin:0}.date{color:var(--muted);font-size:14px;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 6px 18px #28375008}.card h2{font-size:17px;margin:0}.member-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.member{border:1px solid var(--border);border-radius:10px;padding:14px}.member strong{display:block}.points{color:#a87300;font-weight:750;margin-top:6px}.status{font-size:12px;color:var(--muted);margin-top:5px}.task{display:grid;grid-template-columns:20px minmax(140px,1fr) 70px 130px 140px;gap:10px;align-items:center;border-top:1px solid var(--border);padding:12px 0}.task:first-of-type{margin-top:12px}.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--green)}.task.done label{text-decoration:line-through;color:var(--muted)}input,select,button{font:inherit}input[type=number],input[type=date],input[type=time],select{min-width:0;padding:7px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text)}.points-input{width:64px}.task-points{display:flex;align-items:center;gap:4px;color:#a87300}.task-date-time{display:flex;gap:4px}.task-date{width:95px}.task-time{width:82px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.button.secondary{background:#edf3ff;color:var(--blue)}.progress{height:7px;background:var(--border);border-radius:9px;overflow:hidden;margin:16px 0}.progress div{height:100%;width:0;background:var(--green);transition:width .2s}.form-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:14px}.form-row label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.form-row input,.form-row select{font-size:14px}.message{min-height:20px;color:var(--muted);font-size:13px}.history{font-size:13px;color:var(--muted)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #94b5ff;outline-offset:2px}
    @media(max-width:850px){.app{grid-template-columns:74px 1fr}.brand span,.profile div{display:none}.brand{padding-inline:0;text-align:center}nav a{text-align:center;font-size:0}.profile{text-align:center}.member-list{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:620px){.app{display:block}.sidebar{position:fixed;z-index:2;bottom:0;left:0;right:0;height:65px;padding:7px;display:block}.brand,.profile{display:none}nav{grid-template-columns:repeat(3,1fr)}nav a{padding:12px 4px;height:50px}main{padding:24px 12px 82px}h1{font-size:26px}.card{padding:15px}.task{grid-template-columns:20px 1fr 62px;gap:7px}.task-points{grid-column:2;grid-row:2}.task select{grid-column:3;grid-row:2}.task-date-time{grid-column:2/4;grid-row:3}.task-date{flex:1;width:auto}.member-list{gap:7px}.member{padding:10px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⌂</span><span>Family</span></div>
      <nav aria-label="Main navigation"><a class="active" href="index.html">◫ &nbsp; Dashboard</a><a href="calendar.html">▦ &nbsp; Calendar</a><a href="#tasks">✓ &nbsp; Tasks</a></nav>
      <div class="profile"><div><strong>Arun</strong><small>Parent</small></div></div>
    </aside>
    <main>
      <header class="topbar"><div><h1>Good morning, Arun</h1><div class="date"><time id="current-date"></time> · <time id="current-time"></time></div></div><a class="button" href="calendar.html">Open calendar</a></header>
      <section class="card"><div class="card-header"><h2>Family</h2></div><div class="member-list" id="member-list"></div></section>
      <section class="card" id="tasks"><div class="card-header"><h2>Family Tasks</h2><button class="button" id="add-task" type="button">+ Add task</button></div><p class="date">Assign each task a date, time, star value, and family member. Stars are awarded once when completed.</p><div class="progress" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100"><div></div></div><div id="task-list"></div></section>
      <section class="card" id="rewards"><div class="card-header"><h2>Redeem stars</h2></div><form class="form-row" id="redeem-form"><label>Family member<select id="redeem-member"></select></label><label>Reward<input id="reward-name" maxlength="80" placeholder="Choose a reward" required></label><label>Star cost<input id="reward-cost" type="number" min="1" max="100000" value="10" required></label><button class="button" type="submit">Redeem</button></form><p class="message" id="message" role="status" aria-live="polite"></p><ul class="history" id="history"></ul></section>
    </main>
  </div>
  <script>
    const KEY='family-dashboard-rewards-v1';
    const names=['Arun','Jaisy','Joanna','Joshua'];
    const defaults=[['kitchen','Clean the kitchen','08:30'],['groceries','Order groceries','10:00'],['plants','Water the plants','15:30'],['dentist','Schedule dentist appointment','18:00']];
    const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    function read(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.points&&s.tasks)return s}catch(e){console.warn(e)}return{points:Object.fromEntries(names.map(n=>[n,0])),tasks:{},history:[]}}
    const state=read();names.forEach(n=>state.points[n]=Math.max(0,Number(state.points[n])||0));
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Could not save dashboard data',e)}}
    function renderMembers(){const box=document.getElementById('member-list');box.replaceChildren();names.forEach((name,i)=>{const card=document.createElement('div');card.className='member';const strong=document.createElement('strong');strong.textContent=name;const status=document.createElement('div');status.className='status';status.textContent=i<2?'● Home':'● School';const points=document.createElement('div');points.className='points';points.textContent=`★ ${state.points[name]||0} stars`;card.append(strong,status,points);box.append(card)})}
    function saveTask(row){const id=row.dataset.id;const config=state.tasks[id]||{awarded:false};config.title=row.querySelector('label').textContent;config.completed=row.querySelector('input[type=checkbox]').checked;config.points=Math.max(1,Math.min(1000,Number(row.querySelector('.points-input').value)||1));config.assignee=row.querySelector('.assignee').value;config.date=row.querySelector('.task-date').value;config.time=row.querySelector('.task-time').value||'09:00';state.tasks[id]=config;save()}
    function updateProgress(){const rows=[...document.querySelectorAll('.task')];const done=rows.filter(r=>r.querySelector('[type=checkbox]').checked).length;document.querySelector('.progress div').style.width=`${rows.length?Math.round(done/rows.length*100):0}%`;document.querySelector('.progress').setAttribute('aria-valuenow',rows.length?Math.round(done/rows.length*100):0);rows.forEach(r=>r.classList.toggle('done',r.querySelector('[type=checkbox]').checked))}
    function makeTask(id,title,defaultsTime='09:00'){
      const config=state.tasks[id]||{};const row=document.createElement('div');row.className='task';row.dataset.id=id;
      const check=document.createElement('input');check.type='checkbox';check.checked=Boolean(config.completed);check.setAttribute('aria-label',`Mark ${title} complete`);
      const label=document.createElement('label');label.textContent=config.title||title;
      const points=document.createElement('span');points.className='task-points';const number=document.createElement('input');number.className='points-input';number.type='number';number.min='1';number.max='1000';number.value=config.points||10;number.setAttribute('aria-label',`Stars for ${title}`);points.append(number,document.createTextNode(' ★'));
      const select=document.createElement('select');select.className='assignee';select.setAttribute('aria-label',`Task assignee for ${title}`);names.forEach(n=>{const o=document.createElement('option');o.textContent=n;select.append(o)});if(names.includes(config.assignee))select.value=config.assignee;
      const dateTime=document.createElement('span');dateTime.className='task-date-time';const date=document.createElement('input');date.className='task-date';date.type='date';date.value=config.date||today();date.setAttribute('aria-label',`Date for ${title}`);const time=document.createElement('input');time.className='task-time';time.type='time';time.value=config.time||defaultsTime;time.setAttribute('aria-label',`Time for ${title}`);dateTime.append(date,time);row.append(check,label,points,select,dateTime);
      check.addEventListener('change',()=>{const c=state.tasks[id]||{awarded:false};if(check.checked&&!c.awarded){const n=Math.max(1,Math.min(1000,Number(number.value)||1));state.points[select.value]=(state.points[select.value]||0)+n;c.awarded=true;document.getElementById('message').textContent=`${select.value} earned ${n} star${n===1?'':'s'}!`}state.tasks[id]=c;saveTask(row);renderMembers();updateProgress()});row.querySelectorAll('input:not([type=checkbox]),select').forEach(el=>el.addEventListener('change',()=>saveTask(row)));return row
    }
    function renderTasks(){const list=document.getElementById('task-list');list.replaceChildren();defaults.forEach(([id,title,time])=>list.append(makeTask(id,title,time)));Object.entries(state.tasks).filter(([id])=>!defaults.some(item=>item[0]===id)).forEach(([id,c])=>list.append(makeTask(id,c.title||'New task',c.time||'09:00')));updateProgress()}
    function renderHistory(){const ul=document.getElementById('history');ul.replaceChildren();(state.history||[]).slice(-5).reverse().forEach(x=>{const li=document.createElement('li');li.textContent=`${x.member} redeemed ${x.cost} ★ for ${x.reward}`;ul.append(li)})}
    function updateClock(){const d=new Date();const date=document.getElementById('current-date');date.dateTime=today();date.textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);document.getElementById('current-time').textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}).format(d)}
    const memberSelect=document.getElementById('redeem-member');names.forEach(n=>{const o=document.createElement('option');o.textContent=n;memberSelect.append(o)});
    document.getElementById('add-task').addEventListener('click',()=>{const title=prompt('What task would you like to add?');if(!title?.trim())return;const id=`task-${Date.now()}`;state.tasks[id]={title:title.trim(),date:today(),time:'09:00',points:10,assignee:'Arun',completed:false,awarded:false};save();renderTasks()});
    document.getElementById('redeem-form').addEventListener('submit',e=>{e.preventDefault();const name=memberSelect.value,reward=document.getElementById('reward-name').value.trim(),cost=Number(document.getElementById('reward-cost').value),msg=document.getElementById('message');if(!Number.isInteger(cost)||cost<1||!reward){msg.textContent='Enter a reward and a whole-number star cost greater than zero.';return}if((state.points[name]||0)<cost){msg.textContent=`${name} needs ${cost-(state.points[name]||0)} more stars for that reward.`;return}state.points[name]-=cost;state.history=state.history||[];state.history.push({member:name,reward,cost,date:new Date().toISOString()});save();renderMembers();renderHistory();msg.textContent=`${name} redeemed ${cost} stars for ${reward}.`;document.getElementById('reward-name').value=''});
    renderMembers();renderTasks();renderHistory();updateClock();setInterval(updateClock,1000);
  </script>
</body>
</html>
