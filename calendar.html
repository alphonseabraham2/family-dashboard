<!DOCTYPE html>
<html lang="en">
<head>
  <script src="sync.js"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Family calendar with day, week, and month views"><title>Family Calendar</title>
  <style>
    :root{--bg:#eef1f6;--card:#fff;--text:#192230;--muted:#8592a5;--blue:#4f72be;--border:#e3e8f0;--shadow:0 1px 3px #1b2a4a14,0 4px 12px #1b2a4a0d;--ink:#17243a;--cell:#fff;--today:#f1f5ff;--other:#f7f8fb}
    body.dark{--bg:#101826;--card:#1a2436;--text:#e8edf5;--muted:#8d9bb2;--border:#27344b;--shadow:0 1px 3px #0006;--ink:#e8edf5;--cell:#1a2436;--today:#22304a;--other:#161f30}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:100%;max-width:1350px;margin:auto;padding:24px clamp(10px,3vw,32px) 110px;min-width:0}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    h1{font:clamp(24px,3vw,32px) Georgia,serif;margin:0}h2{font-size:17px;margin:0}
    .date{color:var(--muted);font-size:13px;margin-top:6px}
    .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(12px,2vw,20px);box-shadow:var(--shadow);margin-bottom:18px;min-width:0}
    .chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
    .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .chip.person{border-color:var(--c);color:var(--c)}.chip.person.on{background:var(--c);color:#fff}
    .chip.mealtype{border-color:var(--c);color:var(--c)}.chip.mealtype.on{background:var(--c);color:#fff}
    .filters{display:grid;gap:8px;margin-bottom:14px}
    .frow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .flabel{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);width:56px;flex:none}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .nav-controls,.views{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .toolbar button{border:1px solid var(--border);background:var(--card);border-radius:8px;color:var(--text);padding:8px 12px;cursor:pointer;font:inherit}
    .toolbar button.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
    .period{min-width:170px;text-align:center;font-weight:750}
    .calendar{display:grid;border-top:1px solid var(--border);border-left:1px solid var(--border);min-width:0}
    .calendar.week,.calendar.month{grid-template-columns:repeat(7,minmax(0,1fr))}.calendar.day{grid-template-columns:1fr}
    .weekday,.cell{min-width:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
    .weekday{text-align:center;padding:10px 4px;color:var(--muted);font-size:12px;font-weight:700}
    .cell{min-height:125px;padding:7px;background:var(--cell)}.week .cell{min-height:300px}.day .cell{min-height:300px}
    .cell.today{background:var(--today)}.cell.other{background:var(--other);color:var(--muted)}
    .day-number{display:block;font-weight:750;font-size:12px;margin-bottom:8px}
    .event{width:100%;display:block;text-align:left;border:0;border-left:3px solid var(--member);border-radius:4px;margin:5px 0;padding:6px;background:var(--member-bg);color:var(--text);font-size:11px;line-height:1.35;overflow-wrap:anywhere;text-decoration:none}
    .event time,.event .kind{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:2px}
    .event.meal .kind{color:var(--member);text-transform:uppercase;letter-spacing:.05em;font-size:9px}
    .event.completed{opacity:.6;text-decoration:line-through}
    .mp-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}.mp-row:first-of-type{border-top:0}
    .mp-date{width:92px;flex:none;font-weight:700;font-size:13px;padding-top:5px}
    .mp-items{display:flex;gap:6px;flex-wrap:wrap}
    .mp-items .event{width:auto;margin:0;font-size:13px;padding:6px 9px}
    .hint{color:var(--muted);font-size:13px;margin:12px 0 0}
    .hint a{color:var(--blue)}
    .tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 28px #1b2a4a30;width:min(600px,calc(100% - 20px))}
    .tabbar a{flex:1;display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
    .tabbar a span{font-size:18px;line-height:1}
    .tabbar a.active{background:#17243a;color:#fff}
    .tabbar .plus{flex:none;width:46px;height:46px;border-radius:14px;background:#c8553d;color:#fff;border:0;font-size:26px;cursor:pointer}
    @media(max-width:700px){
      .card{overflow:hidden}.toolbar{justify-content:center}.nav-controls,.views{justify-content:center}.period{min-width:130px}
      .calendar.month{grid-template-columns:repeat(7,minmax(34px,1fr));overflow-x:auto}.month .cell{min-height:82px;padding:3px}.month .event{padding:3px;font-size:9px}.month .event time,.month .event .kind{font-size:8px}
      .weekday{font-size:10px;padding:6px 1px}.calendar.week{grid-template-columns:repeat(7,minmax(105px,1fr));overflow-x:auto}.week .cell{min-height:220px;padding:5px}.event{padding:5px;font-size:10px}
      .flabel{width:100%}.mp-date{width:70px}}
    @media(max-width:380px){main{padding-inline:7px}.toolbar button{padding:7px 9px}.period{min-width:115px;font-size:13px}}
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <div><h1>Calendar</h1><div class="date">Tasks and the meal plan, by day, week or month</div></div>
    <div class="tools"><a class="chip" href="recipes.html#plan">+ Plan a meal</a><button class="chip" id="theme" type="button" aria-label="Toggle dark mode">🌙</button></div>
  </header>

  <section class="card">
    <div class="filters" id="filters" aria-label="Filters"></div>
    <div class="toolbar">
      <div class="nav-controls"><button id="previous" aria-label="Previous period">‹</button><button id="today">Today</button><button id="next" aria-label="Next period">›</button><span class="period" id="period"></span></div>
      <div class="views"><button data-view="day">Day</button><button data-view="week" class="active">Week</button><button data-view="month">Month</button></div>
    </div>
    <div class="calendar week" id="calendar" aria-live="polite"></div>
    <p class="hint">Tasks and meals are shared with the other pages in this browser. Manage <a href="tasks.html">tasks</a> or <a href="recipes.html">recipes and meal plans</a>.</p>
  </section>

  <section class="card" id="mealpanel">
    <h2 id="mealtitle">Meal plan</h2>
    <div id="meallist"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Main navigation">
  <a href="index.html"><span>◫</span>Today</a>
  <a class="active" href="calendar.html"><span>▦</span>Calendar</a>
  <a href="tasks.html"><span>✓</span>Routines</a>
  <a href="recipes.html"><span>🍽</span>Meals</a>
  <a href="rewards.html"><span>★</span>Rewards</a>
  <button class="plus" type="button" aria-label="Plan a meal" onclick="location.href='recipes.html#plan'">+</button>
</nav>

<script>
const KEY='family-dashboard-rewards-v1',FKEY='family-calendar-filters-v1';
const MEMBERS=[{name:'Arun',color:'#4f72be'},{name:'Jaisy',color:'#d55f91'},{name:'Joanna',color:'#2f9d72'},{name:'Joshua',color:'#d97706'}],byName=Object.fromEntries(MEMBERS.map(m=>[m.name,m]));
const DEFAULTS=[['kitchen','Clean the kitchen','08:30','Arun'],['groceries','Order groceries','10:00','Jaisy'],['plants','Water the plants','15:30','Joanna'],['dentist','Schedule dentist appointment','18:00','Joshua']];
const TYPES=['Breakfast','Lunch','Dinner','Snack'],TYPE_COLOR={Breakfast:'#e0a100',Lunch:'#3b9ac4',Dinner:'#c8553d',Snack:'#7d6bd1'};
const $=id=>document.getElementById(id),calendar=$('calendar'),period=$('period'),weekdays=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtTime=t=>{const x=new Date('1970-01-01T'+t);return isNaN(x)?t:x.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const weekStartOf=d=>{const s=new Date(d);s.setHours(0,0,0,0);s.setDate(s.getDate()-s.getDay());return s};

/* shared data + one-time starter meal plan (identical to recipes.html so either page can seed it) */
const SEED_RECIPES=[
 {id:'r-pancakes',name:'Pancakes',icon:'🥞',category:'Breakfast',servings:4,minutes:20,ingredients:'1 cup flour\n1 cup milk\n1 egg\n1 tbsp sugar\n2 tsp baking powder',instructions:'Whisk everything together.\nPour batter onto a hot greased pan.\nFlip when bubbles form and cook until golden.'},
 {id:'r-stirfry',name:'Chicken Stir-fry',icon:'🍗',category:'Dinner',servings:4,minutes:25,ingredients:'500 g chicken strips\n2 cups mixed vegetables\n3 tbsp soy sauce\n1 tbsp oil\nCooked rice',instructions:'Heat oil and cook chicken until browned.\nAdd vegetables and stir-fry for 5 minutes.\nStir in soy sauce and serve over rice.'},
 {id:'r-bolognese',name:'Spaghetti Bolognese',icon:'🍝',category:'Dinner',servings:5,minutes:45,ingredients:'500 g beef mince\n1 onion, diced\n1 jar pasta sauce\n400 g spaghetti',instructions:'Brown the mince with the onion.\nAdd the sauce and simmer for 20 minutes.\nCook the spaghetti and serve with the sauce.'},
 {id:'r-friedrice',name:'Egg Fried Rice',icon:'🍚',category:'Dinner',servings:4,minutes:20,ingredients:'3 cups cooked rice\n3 eggs\n1 cup frozen peas and corn\n2 tbsp soy sauce\n2 spring onions',instructions:'Scramble the eggs in a hot pan and set aside.\nFry the vegetables, then add the rice and soy sauce.\nFold in the eggs and top with spring onion.'},
 {id:'r-fruit',name:'Fruit Salad',icon:'🍓',category:'Snack',servings:4,minutes:10,ingredients:'2 apples\n1 banana\n1 cup berries\n1 orange',instructions:'Chop all fruit into bite-size pieces.\nToss together and serve chilled.'}];
function seed(s){
  if(s.mealsSeeded)return false;
  if(!Array.isArray(s.recipes))s.recipes=SEED_RECIPES.map(r=>({...r}));
  if(!Array.isArray(s.meals)){const ws=weekStartOf(new Date()),din=['r-stirfry','r-bolognese','r-friedrice'];s.meals=[];
    for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);s.meals.push({id:'m-seed-'+i,date:key(d),type:'Dinner',recipeId:din[i%3]});if(i===0||i===6)s.meals.push({id:'m-seed-b'+i,date:key(d),type:'Breakfast',recipeId:'r-pancakes'})}}
  s.mealsSeeded=true;return true}
function read(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return s&&typeof s==='object'?s:{}}catch(e){return{}}}
function load(){const s=read();if(seed(s)){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}return s}

function getTasks(s){const stored=s.tasks||{},items=[];
  Object.entries(stored).forEach(([id,t])=>items.push({kind:'task',id,title:t.title||id,date:t.date||'',time:t.time||'09:00',assignee:byName[t.assignee]?t.assignee:'Arun',completed:!!t.completed}));
  if(!s.tasksSeeded)DEFAULTS.forEach(([id,title,time,person])=>{if(!stored[id])items.push({kind:'task',id,title,date:key(new Date()),time,assignee:person,completed:false})});
  return items.filter(t=>t.date)}
function getMeals(s){const rec=Object.fromEntries((s.recipes||[]).map(r=>[r.id,r]));
  return (s.meals||[]).filter(m=>rec[m.recipeId]&&m.date).map(m=>({kind:'meal',id:m.id,date:m.date,type:m.type,recipe:rec[m.recipeId]}))}

/* filters (apply to day, week and month views) */
let f={show:'All',person:'All',type:'All'};try{f={...f,...JSON.parse(localStorage.getItem(FKEY)||'{}')}}catch(e){}
const saveF=()=>{try{localStorage.setItem(FKEY,JSON.stringify(f))}catch(e){}};
let view='week',cursor=new Date();cursor.setHours(0,0,0,0);

function chip(label,on,onclick,color){const b=document.createElement('button');b.type='button';b.className='chip'+(color?' person':'')+(on?' on':'');if(color)b.style.setProperty('--c',color);b.textContent=label;b.setAttribute('aria-pressed',String(on));b.onclick=onclick;return b}
function row(label,chips){const r=document.createElement('div');r.className='frow';const l=document.createElement('span');l.className='flabel';l.textContent=label;r.append(l,...chips);return r}
function renderFilters(){const box=$('filters');box.replaceChildren();
  box.append(row('Show',['All','Tasks','Meals'].map(v=>chip(v==='All'?'Everything':v,f.show===v,()=>{f.show=v;saveF();render()}))));
  if(f.show!=='Meals')box.append(row('Person',['All',...MEMBERS.map(m=>m.name)].map(n=>chip(n==='All'?'Everyone':n,f.person===n,()=>{f.person=n;saveF();render()},n==='All'?null:byName[n].color))));
  if(f.show!=='Tasks')box.append(row('Meal',['All',...TYPES].map(t=>{const b=chip(t==='All'?'All meals':t,f.type===t,()=>{f.type=t;saveF();render()},t==='All'?null:TYPE_COLOR[t]);return b})))}

function mealLink(m){const a=document.createElement('a');a.className='event meal';const c=TYPE_COLOR[m.type]||'#888';a.style.cssText=`--member:${c};--member-bg:${c}18`;a.href='recipes.html#'+encodeURIComponent(m.recipe.id);
  const k=document.createElement('span');k.className='kind';k.textContent=m.type;const t=document.createElement('span');t.textContent=`${m.recipe.icon||'🍽️'} ${m.recipe.name}`;a.append(k,t);return a}
function taskLink(t){const p=byName[t.assignee]||MEMBERS[0],a=document.createElement('a');a.className=`event${t.completed?' completed':''}`;a.style.cssText=`--member:${p.color};--member-bg:${p.color}18`;a.href='tasks.html';
  const time=document.createElement('time');time.textContent=fmtTime(t.time);const text=document.createElement('span');text.textContent=`${t.title} · ${t.assignee}`;a.append(time,text);return a}

function render(){
  const s=load();calendar.replaceChildren();calendar.className=`calendar ${view}`;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));renderFilters();
  let dates=[];
  if(view==='day'){dates=[new Date(cursor)];period.textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(cursor)}
  else if(view==='week'){const start=weekStartOf(cursor);dates=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});period.textContent=`${new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(dates[0])} – ${new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(dates[6])}`}
  else{const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=weekStartOf(first);dates=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});period.textContent=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(cursor)}
  if(view!=='day')weekdays.forEach(x=>{const h=document.createElement('div');h.className='weekday';h.textContent=x;calendar.append(h)});
  const tasks=f.show==='Meals'?[]:getTasks(s).filter(t=>f.person==='All'||t.assignee===f.person);
  const meals=f.show==='Tasks'?[]:getMeals(s).filter(m=>f.type==='All'||m.type===f.type).sort((a,b)=>TYPES.indexOf(a.type)-TYPES.indexOf(b.type));
  dates.forEach(date=>{const k=key(date),cell=document.createElement('div');cell.className='cell';
    if(k===key(new Date()))cell.classList.add('today');if(view==='month'&&date.getMonth()!==cursor.getMonth())cell.classList.add('other');
    const n=document.createElement('span');n.className='day-number';n.textContent=view==='day'?new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(date):date.getDate();cell.append(n);
    meals.filter(m=>m.date===k).forEach(m=>cell.append(mealLink(m)));
    tasks.filter(t=>t.date===k).sort((a,b)=>a.time.localeCompare(b.time)).forEach(t=>cell.append(taskLink(t)));
    calendar.append(cell)});
  renderMealPanel(dates,meals)}

function renderMealPanel(dates,meals){
  const panel=$('mealpanel');panel.classList.toggle('hidden',f.show==='Tasks');if(f.show==='Tasks')return;
  $('mealtitle').textContent=`Meal plan · ${view==='day'?'today’s view':view==='week'?'this week':'this month'}`;
  const list=$('meallist');list.replaceChildren();let any=false;
  dates.forEach(d=>{const k=key(d);if(view==='month'&&d.getMonth()!==cursor.getMonth())return;const ms=meals.filter(m=>m.date===k);if(!ms.length)return;any=true;
    const r=document.createElement('div');r.className='mp-row';const dl=document.createElement('div');dl.className='mp-date';dl.textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
    const it=document.createElement('div');it.className='mp-items';ms.forEach(m=>it.append(mealLink(m)));r.append(dl,it);list.append(r)});
  if(!any){const e=document.createElement('p');e.className='hint';e.innerHTML=`No meals ${f.type!=='All'?f.type.toLowerCase()+' ':''}planned for this period. <a href="recipes.html#plan">Plan a meal</a>`;list.append(e)}}

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
$('today').onclick=()=>{cursor=new Date();cursor.setHours(0,0,0,0);render()};
function move(n){if(view==='day')cursor.setDate(cursor.getDate()+n);else if(view==='week')cursor.setDate(cursor.getDate()+n*7);else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
try{if(localStorage.getItem('family-dashboard-theme')==='dark')document.body.classList.add('dark')}catch(e){}
$('theme').onclick=()=>{const d=document.body.classList.toggle('dark');try{localStorage.setItem('family-dashboard-theme',d?'dark':'light')}catch(e){}};
window.addEventListener('storage',e=>{if(e.key===KEY)render()});window.addEventListener('focus',render);
render();
</script>
</body>
</html>
