<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Family calendar with day, week, and month views"><title>Family Calendar</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#192230;--muted:#738195;--navy:#17243a;--blue:#4f72be;--border:#e7ecf3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:750;padding:0 10px 28px}.brand-mark{display:inline-grid;place-items:center;margin-right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy)}nav{display:grid;gap:6px}nav a{padding:12px 14px;border-radius:10px;color:#b9c4d4;text-decoration:none}nav a.active,nav a:hover{background:#ffffff1a;color:#fff}.profile{margin-top:auto;border-top:1px solid #ffffff20;padding:16px 8px 0}.profile small{display:block;color:#9facbf;margin-top:3px}main{width:100%;max-width:1350px;margin:auto;padding:34px clamp(10px,4vw,38px) 48px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}h1{font:clamp(26px,3vw,34px) Georgia,serif;margin:0}.date{color:var(--muted);font-size:14px;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(12px,2vw,20px);box-shadow:0 6px 18px #28375008}.button{border:1px solid var(--border);border-radius:8px;padding:9px 13px;background:#fff;color:var(--text);text-decoration:none}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.nav-controls,.views{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar button{border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--text);padding:8px 12px;cursor:pointer}.toolbar button.active{background:var(--blue);border-color:var(--blue);color:#fff}.period{min-width:170px;text-align:center;font-weight:750}.calendar{display:grid;border-top:1px solid var(--border);border-left:1px solid var(--border);min-width:0}.calendar.week,.calendar.month{grid-template-columns:repeat(7,minmax(0,1fr))}.calendar.day{grid-template-columns:1fr}.weekday,.cell{min-width:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.weekday{text-align:center;padding:10px 4px;color:var(--muted);font-size:12px;font-weight:700}.cell{min-height:125px;padding:7px;background:#fff}.week .cell{min-height:300px}.day .cell{min-height:400px}.cell.today{background:#f5f8ff}.cell.other{background:#fafbfd;color:#9ba6b5}.day-number{display:block;font-weight:750;font-size:12px;margin-bottom:8px}.event{width:100%;display:block;text-align:left;border:0;border-left:3px solid var(--member);border-radius:4px;margin:5px 0;padding:6px;background:var(--member-bg);color:var(--text);font-size:11px;line-height:1.35;overflow-wrap:anywhere;text-decoration:none}.event time{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:2px}.event.completed{opacity:.6;text-decoration:line-through}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.legend-item{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;background:#fff;padding:5px 9px;font-size:12px}.legend-dot{width:9px;height:9px;border-radius:50%;background:var(--member)}.empty,.hint{color:var(--muted);font-size:13px}.hint{margin:14px 0 0}
@media(max-width:1000px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:20px 10px}.brand{text-align:center;padding:0 0 22px}.brand span:not(.brand-mark),.profile{display:none}nav a{padding:12px 6px;text-align:center;font-size:0}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:20;left:0;right:0;bottom:0;height:auto;min-height:64px;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));display:block}.brand,.profile{display:none}nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}nav a{height:52px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:0;line-height:1}nav a::first-letter{font-size:21px}main{padding:20px 10px calc(88px + env(safe-area-inset-bottom))}.topbar{align-items:flex-start}.card{overflow:hidden}.toolbar{justify-content:center}.nav-controls,.views{justify-content:center}.period{min-width:130px}.calendar.month{grid-template-columns:repeat(7,minmax(34px,1fr));overflow-x:auto}.month .cell{min-height:82px;padding:3px}.month .event{padding:3px;font-size:9px}.month .event time{font-size:8px}.weekday{font-size:10px;padding:6px 1px}.calendar.week{grid-template-columns:repeat(7,minmax(95px,1fr));overflow-x:auto}.week .cell{min-height:220px;padding:5px}.event{padding:5px;font-size:10px}}
@media(max-width:380px){main{padding-inline:7px}.toolbar button{padding:7px 9px}.period{min-width:115px;font-size:13px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">⌂</span><span>Family</span></div><nav aria-label="Main navigation"><a href="index.html">◫ &nbsp; Dashboard</a><a class="active" href="calendar.html">▦ &nbsp; Calendar</a><a href="index.html#tasks">✓ &nbsp; Tasks</a><a href="rewards.html">★ &nbsp; Rewards</a></nav><div class="profile"><strong>Arun</strong><small>Parent</small></div></aside><main><header class="topbar"><div><h1>Family Calendar</h1><div class="date">Every assigned task, shown by family member</div></div><a class="button" href="index.html#tasks">Manage tasks</a></header><section class="card"><div class="legend" id="legend"></div><div class="toolbar"><div class="nav-controls"><button id="previous" aria-label="Previous period">‹</button><button id="today">Today</button><button id="next" aria-label="Next period">›</button><span class="period" id="period"></span></div><div class="views"><button data-view="day">Day</button><button data-view="week" class="active">Week</button><button data-view="month">Month</button></div></div><div class="calendar week" id="calendar" aria-live="polite"></div><p class="hint">Calendar tasks are shared with the dashboard in this browser.</p></section></main></div>
<script>
const KEY='family-dashboard-rewards-v1',MEMBERS=[{name:'Arun',color:'#4f72be'},{name:'Jaisy',color:'#d55f91'},{name:'Joanna',color:'#2f9d72'},{name:'Joshua',color:'#d97706'}],byName=Object.fromEntries(MEMBERS.map(m=>[m.name,m])),defaults=[['kitchen','Clean the kitchen','08:30','Arun'],['groceries','Order groceries','10:00','Jaisy'],['plants','Water the plants','15:30','Joanna'],['dentist','Schedule dentist appointment','18:00','Joshua']],calendar=document.getElementById('calendar'),period=document.getElementById('period'),weekdays=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let view='week',cursor=new Date();cursor.setHours(0,0,0,0);function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function getTasks(){const stored=read().tasks||{},items=[];defaults.forEach(([id,title,time,person])=>{const t=stored[id]||{};items.push({id,title:t.title||title,date:t.date||key(new Date()),time:t.time||time,assignee:t.assignee||person,completed:!!t.completed})});Object.entries(stored).forEach(([id,t])=>{if(defaults.some(d=>d[0]===id))return;items.push({id,title:t.title||id,date:t.date||'',time:t.time||'09:00',assignee:t.assignee||'Arun',completed:!!t.completed})});return items.filter(t=>t.date)}
function render(){calendar.replaceChildren();calendar.className=`calendar ${view}`;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let dates=[];if(view==='day'){dates=[new Date(cursor)];period.textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(cursor)}else if(view==='week'){const start=new Date(cursor);start.setDate(start.getDate()-start.getDay());dates=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});period.textContent=`${new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(dates[0])} – ${new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(dates[6])}`}else{const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());dates=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});period.textContent=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(cursor)}if(view!=='day')weekdays.forEach(x=>{const h=document.createElement('div');h.className='weekday';h.textContent=x;calendar.append(h)});const tasks=getTasks();dates.forEach(date=>{const cell=document.createElement('div');cell.className='cell';if(key(date)===key(new Date()))cell.classList.add('today');if(view==='month'&&date.getMonth()!==cursor.getMonth())cell.classList.add('other');const n=document.createElement('span');n.className='day-number';n.textContent=view==='day'?new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(date):date.getDate();cell.append(n);tasks.filter(t=>t.date===key(date)).sort((a,b)=>a.time.localeCompare(b.time)).forEach(t=>{const p=byName[t.assignee]||MEMBERS[0],a=document.createElement('a');a.className=`event${t.completed?' completed':''}`;a.style.cssText=`--member:${p.color};--member-bg:${p.color}18`;a.href='index.html#tasks';const time=document.createElement('time');time.textContent=t.time;const text=document.createElement('span');text.textContent=`${t.title} · ${t.assignee}`;a.append(time,text);cell.append(a)});calendar.append(cell)})}
MEMBERS.forEach(m=>{const item=document.createElement('span');item.className='legend-item';item.innerHTML=`<span class="legend-dot" style="--member:${m.color}"></span>${m.name}`;document.getElementById('legend').append(item)});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('today').onclick=()=>{cursor=new Date();cursor.setHours(0,0,0,0);render()};function move(n){if(view==='day')cursor.setDate(cursor.getDate()+n);else if(view==='week')cursor.setDate(cursor.getDate()+n*7);else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();
</script></body></html>
