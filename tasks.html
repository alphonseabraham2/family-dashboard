<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Family tasks, assignments, dates, and rewards">
  <title>Family Tasks</title>
  <style>
  :root{--bg:#f3f6fb;--card:#fff;--text:#192230;--muted:#738195;--navy:#17243a;--blue:#4f72be;--green:#63b89a;--border:#e5eaf2}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
  .sidebar{background:var(--navy);color:#fff;padding:26px 16px;display:flex;flex-direction:column}.brand{font-weight:750;padding:0 10px 24px}.brand-mark{display:inline-grid;place-items:center;margin-right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy)}nav{display:grid;gap:6px}nav a{padding:12px;border-radius:10px;color:#c6d0df;text-decoration:none}nav a.active,nav a:hover{background:#ffffff1a;color:#fff}.profile{margin-top:auto;border-top:1px solid #ffffff30;padding:16px 8px}
  main{width:100%;max-width:1300px;margin:auto;padding:32px clamp(12px,4vw,40px) calc(48px + env(safe-area-inset-bottom));min-width:0}.topbar,.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topbar{margin-bottom:22px}h1{font:clamp(26px,3vw,34px) Georgia,serif;margin:0}.date{color:var(--muted);font-size:14px;margin-top:7px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(14px,2vw,20px);margin-bottom:18px}.card h2{font-size:17px;margin:0}.progress{height:7px;background:var(--border);border-radius:8px;margin:14px 0;overflow:hidden}.progress div{height:100%;background:var(--green);width:0;transition:width .2s}.progress-label{color:var(--muted);font-size:13px}.task-list{display:grid}.task{display:grid;grid-template-columns:26px minmax(120px,1fr) 80px minmax(120px,160px) minmax(190px,240px);gap:10px;align-items:center;border-top:1px solid var(--border);padding:12px 0;min-width:0}.task label{overflow-wrap:anywhere}.task input,.task select{min-width:0;width:100%;padding:8px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font:inherit}.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--member);justify-self:center}.task .assignee{border-left:4px solid var(--member)}.task-date-time{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}.points-input{max-width:72px}.task-points{white-space:nowrap}.task.done label{text-decoration:line-through;color:var(--muted)}.button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 14px;text-decoration:none;cursor:pointer;font:inherit;font-weight:650}
  @media(max-width:1050px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:16px 7px}.brand{padding:0 0 16px;text-align:center}.brand span:not(.brand-mark),.profile{display:none}nav a{padding:12px 4px;text-align:center;font-size:0}.task{grid-template-columns:26px minmax(0,1fr) 76px minmax(140px,1fr);row-gap:8px;padding:12px 4px}.task label{grid-column:2}.task-points{grid-column:3}.task .assignee{grid-column:4}.task-date-time{grid-column:2/5;max-width:420px}.task input[type=checkbox]{grid-column:1}}
  @media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:20;left:0;right:0;bottom:0;height:auto;min-height:64px;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));display:block}.brand,.profile{display:none}nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}nav a{height:52px;padding:5px 2px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.1;border-radius:7px}main{padding:20px 10px calc(88px + env(safe-area-inset-bottom))}.task{grid-template-columns:26px minmax(0,1fr) 76px;gap:7px;margin:0;padding:12px 8px;border:1px solid var(--border);border-left:4px solid var(--member);border-radius:10px}.task+.task{margin-top:9px}.task input[type=checkbox]{grid-column:1;grid-row:1}.task label{grid-column:2;grid-row:1}.task-points{grid-column:3;grid-row:1;justify-self:end}.task .assignee{grid-column:2/4;grid-row:2}.task-date-time{grid-column:2/4;grid-row:3;width:100%;max-width:none}.task input,.task select{font-size:16px;min-height:42px}}
  @media(max-width:380px){nav a{font-size:9px}main{padding-inline:7px}.task{grid-template-columns:24px minmax(0,1fr) 65px;gap:5px;padding:10px 6px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><span class="brand-mark">⌂</span><span>Family</span></div><nav aria-label="Main navigation"><a href="index.html">◫ Dashboard</a><a href="calendar.html">▦ Calendar</a><a class="active" href="tasks.html">✓ Tasks</a><a href="rewards.html">★ Rewards</a></nav><div class="profile"><strong>Arun</strong><br>Parent</div></aside>
  <main>
    <header class="topbar"><div><h1>Family Tasks</h1><div class="date">Assign tasks, dates, times, and stars.</div></div><button class="button" id="add-task">+ Add task</button></header>
    <section class="card"><div class="card-header"><h2>Task progress</h2></div><div class="progress"><div id="progress-bar"></div></div><div class="progress-label" id="progress-label"></div><div class="task-list" id="task-list"></div></section>
  </main>
</div>
<script>
const KEY='family-dashboard-rewards-v1',MEMBERS=[{name:'Arun',color:'#4f72be'},{name:'Jaisy',color:'#d55f91'},{name:'Joanna',color:'#2f9d72'},{name:'Joshua',color:'#d97706'}],byName=Object.fromEntries(MEMBERS.map(m=>[m.name,m])),defaults=[['kitchen','Clean the kitchen','08:30'],['groceries','Order groceries','10:00'],['plants','Water the plants','15:30'],['dentist','Schedule dentist appointment','18:00']];const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function read(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.points&&s.tasks)return s}catch(e){console.warn(e)}return{points:Object.fromEntries(MEMBERS.map(m=>[m.name,0])),tasks:{},history:[]}}const state=read();MEMBERS.forEach(m=>state.points[m.name]=Math.max(0,Number(state.points[m.name])||0));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn(e)}}function style(n){const p=byName[n]||MEMBERS[0];return `--member:${p.color};--member-bg:${p.color}18`}
function progress(){const rows=[...document.querySelectorAll('.task')],done=rows.filter(r=>r.querySelector('[type=checkbox]').checked).length;document.getElementById('progress-bar').style.width=(rows.length?Math.round(done/rows.length*100):0)+'%';document.getElementById('progress-label').textContent=`${done} of ${rows.length} tasks complete`}
function saveTask(row){const c=state.tasks[row.dataset.id]||{};c.title=row.querySelector('label').textContent;c.completed=row.querySelector('[type=checkbox]').checked;c.points=Math.max(1,Number(row.querySelector('.points-input').value)||1);c.assignee=row.querySelector('.assignee').value;c.date=row.querySelector('.task-date').value;c.time=row.querySelector('.task-time').value||'09:00';state.tasks[row.dataset.id]=c;save()}
function makeTask(id,title,time='09:00'){const c=state.tasks[id]||{},row=document.createElement('div');row.className='task';row.dataset.id=id;row.style.cssText=style(c.assignee||'Arun');const check=document.createElement('input');check.type='checkbox';check.checked=!!c.completed;check.setAttribute('aria-label',`Mark ${title} complete`);const label=document.createElement('label');label.textContent=c.title||title;const value=document.createElement('span');value.className='task-points';value.innerHTML=`<input class="points-input" type="number" min="1" max="1000" value="${c.points||10}" aria-label="Star value"> ★`;const assignee=document.createElement('select');assignee.className='assignee';MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;assignee.append(o)});assignee.value=c.assignee||'Arun';const dt=document.createElement('span');dt.className='task-date-time';const date=document.createElement('input');date.className='task-date';date.type='date';date.value=c.date||today();const tm=document.createElement('input');tm.className='task-time';tm.type='time';tm.value=c.time||time;dt.append(date,tm);row.append(check,label,value,assignee,dt);row.classList.toggle('done',check.checked);check.addEventListener('change',()=>{const stars=Math.max(1,Number(value.querySelector('input').value)||1);if(check.checked&&!c.completed)state.points[assignee.value]=(state.points[assignee.value]||0)+stars;else if(!check.checked&&c.completed)state.points[assignee.value]=Math.max(0,(state.points[assignee.value]||0)-stars);c.completed=check.checked;state.tasks[id]=c;save();row.classList.toggle('done',check.checked);progress()});assignee.addEventListener('change',()=>{row.style.cssText=style(assignee.value);saveTask(row)});row.querySelectorAll('input:not([type=checkbox])').forEach(x=>x.addEventListener('change',()=>saveTask(row)));return row}
function renderTasks(){const list=document.getElementById('task-list');list.replaceChildren();defaults.forEach(([id,title,time])=>list.append(makeTask(id,title,time)));Object.entries(state.tasks).filter(([id])=>!defaults.some(d=>d[0]===id)).forEach(([id,t])=>list.append(makeTask(id,t.title||id,t.time||'09:00')));progress()}document.getElementById('add-task').onclick=()=>{const title=prompt('What task would you like to add?');if(!title?.trim())return;const id='task-'+Date.now();state.tasks[id]={title:title.trim(),date:today(),time:'09:00',points:10,assignee:'Arun',completed:false};save();renderTasks()};renderTasks();
</script>
</body>
</html>
