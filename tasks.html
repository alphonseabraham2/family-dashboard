<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Family tasks, assignments, dates, and rewards">
  <title>Family Tasks</title>
  <style>
    :root{--bg:#eef1f6;--card:#fff;--text:#192230;--muted:#8592a5;--blue:#4f72be;--green:#63b89a;--border:#e3e8f0;--shadow:0 1px 3px #1b2a4a14,0 4px 12px #1b2a4a0d;--track:#dfe5ee;--ink:#17243a;--red:#d64545}
    body.dark{--bg:#101826;--card:#1a2436;--text:#e8edf5;--muted:#8d9bb2;--border:#27344b;--shadow:0 1px 3px #0006;--track:#2b3a54;--ink:#e8edf5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:100%;max-width:900px;margin:auto;padding:24px clamp(12px,3vw,32px) 110px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    h1{font:clamp(24px,3vw,32px) Georgia,serif;margin:0}h2{font-size:17px;margin:0}
    .date,.muted{color:var(--muted);font-size:13px;margin-top:6px}
    .tools{display:flex;gap:8px;align-items:center}
    .chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
    .button.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(14px,2vw,20px);margin-bottom:18px;box-shadow:var(--shadow)}
    .progress{height:7px;background:var(--track);border-radius:8px;margin:12px 0 8px;overflow:hidden}.progress div{height:100%;background:var(--green);width:0;transition:width .25s}
    .progress-label{color:var(--muted);font-size:13px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
    .filters .chip{border-color:var(--member,var(--border));color:var(--member,var(--text))}
    .filters .chip.on{background:var(--member,var(--ink));color:#fff;border-color:var(--member,var(--ink))}
    .task-list{display:grid;margin-top:8px}
    .task{display:flex;align-items:center;gap:12px;padding:12px 2px 12px 10px;border-top:1px solid var(--border);border-left:4px solid var(--member);min-width:0}
    .task:first-child{border-top:0}
    .task input[type=checkbox]{width:22px;height:22px;accent-color:var(--member);flex:none;cursor:pointer}
    .tmain{flex:1;min-width:0}
    .ttitle{font-weight:650;overflow-wrap:anywhere}
    .tmeta{font-size:12px;color:var(--muted);margin-top:3px}
    .who{color:var(--member);font-weight:700}
    .late{color:var(--red);font-weight:700}
    .tstars{white-space:nowrap;font-weight:700;color:#d49b00;font-size:14px}
    .task.done .ttitle{text-decoration:line-through;color:var(--muted)}
    .pill{border:0;border-radius:8px;padding:8px 9px;font:inherit;font-size:13px;background:var(--bg);color:var(--muted);cursor:pointer}
    .pill:hover{color:var(--text)}
    .empty{padding:20px 4px;color:var(--muted)}
    .form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .form-row label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
    .form-row .wide{grid-column:1/-1}
    input,select{min-width:0;width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;background:var(--bg);color:var(--text);font:inherit}
    .form-actions{grid-column:1/-1;display:flex;gap:8px}
    .hidden{display:none!important}
    .message{min-height:20px;color:var(--muted);font-size:13px;margin:10px 0 0}
    .tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 28px #1b2a4a30;width:min(600px,calc(100% - 20px))}
    .tabbar a{flex:1;display:grid;justify-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
    .tabbar a span{font-size:18px;line-height:1}
    .tabbar a.active{background:#17243a;color:#fff}
    .tabbar .plus{flex:none;width:46px;height:46px;border-radius:14px;background:#c8553d;color:#fff;border:0;font-size:26px;cursor:pointer}
    @media(max-width:520px){.form-row{grid-template-columns:minmax(0,1fr)}input,select{font-size:16px}.tstars{font-size:13px}}
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <div><h1>Tasks</h1><div class="date">Add, edit, assign and complete tasks to earn stars.</div></div>
    <div class="tools"><button class="button" id="add-task" type="button">+ Add task</button><button class="chip" id="theme" type="button" aria-label="Toggle dark mode">🌙</button></div>
  </header>

  <section class="card hidden" id="form-card">
    <h2 id="form-title">Add task</h2>
    <form class="form-row" id="task-form">
      <label class="wide">Task<input id="f-title" maxlength="120" placeholder="e.g. Take out the bins" required></label>
      <label>Assigned to<select id="f-assignee"></select></label>
      <label>Stars<input id="f-points" type="number" min="1" max="1000" value="10" required></label>
      <label>Date<input id="f-date" type="date" required></label>
      <label>Time<input id="f-time" type="time" value="09:00"></label>
      <div class="form-actions"><button class="button" id="f-save" type="submit">Add task</button><button class="button secondary" id="f-cancel" type="button">Cancel</button></div>
    </form>
  </section>

  <section class="card">
    <div class="rhead"><h2>Task progress</h2></div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="progress-label" id="progress-label"></div>
    <div class="filters" id="filters" role="group" aria-label="Filter by person"></div>
    <div class="task-list" id="task-list"></div>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </section>
</main>

<nav class="tabbar" aria-label="Main navigation">
  <a href="index.html"><span>◫</span>Today</a>
  <a href="calendar.html"><span>▦</span>Calendar</a>
  <a class="active" href="tasks.html"><span>✓</span>Routines</a>
  <a href="recipes.html"><span>🍽</span>Meals</a>
  <a href="rewards.html"><span>★</span>Rewards</a>
  <button class="plus" type="button" aria-label="Add task" onclick="openForm()">+</button>
</nav>

<script>
const KEY='family-dashboard-rewards-v1';
const MEMBERS=[{name:'Arun',color:'#4f72be'},{name:'Jaisy',color:'#d55f91'},{name:'Joanna',color:'#2f9d72'},{name:'Joshua',color:'#d97706'}];
const byName=Object.fromEntries(MEMBERS.map(m=>[m.name,m]));
const DEFAULTS=[['kitchen','Clean the kitchen','08:30'],['groceries','Order groceries','10:00'],['plants','Water the plants','15:30'],['dentist','Schedule dentist appointment','18:00']];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filter='All',editingId=null;

function readState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return s&&typeof s==='object'?s:{}}catch(e){console.warn(e);return{}}}
let state=readState();
function ensure(){
  if(!state.points||typeof state.points!=='object')state.points={};
  MEMBERS.forEach(m=>state.points[m.name]=Math.max(0,Number(state.points[m.name])||0));
  if(!state.tasks||typeof state.tasks!=='object')state.tasks={};
  if(!Array.isArray(state.history))state.history=[];
  if(!state.tasksSeeded){DEFAULTS.forEach(([id,title,time])=>{if(!state.tasks[id])state.tasks[id]={title,time,date:today(),points:10,assignee:'Arun',completed:false}});state.tasksSeeded=true;save()}
  Object.values(state.tasks).forEach(t=>{if(!byName[t.assignee])t.assignee='Arun'})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn(e);msg('Could not save changes in this browser.')}}
const msg=t=>$('message').textContent=t;
const mstyle=n=>{const p=byName[n]||MEMBERS[0];return `--member:${p.color}`};

// Stars: awarded to the assignee on completion, refunded if undone, reassigned, re-valued or deleted.
function award(t){const s=Math.max(1,Number(t.points)||1);state.points[t.assignee]=(state.points[t.assignee]||0)+s;t.awarded={to:t.assignee,stars:s}}
function refund(t){const a=t.awarded||{to:t.assignee,stars:Math.max(1,Number(t.points)||1)};state.points[a.to]=Math.max(0,(state.points[a.to]||0)-a.stars);delete t.awarded}

// CREATE / UPDATE
function openForm(task){
  editingId=task?task.id:null;
  $('form-title').textContent=task?'Edit task':'Add task';$('f-save').textContent=task?'Save changes':'Add task';
  $('f-title').value=task?task.title:'';$('f-assignee').value=task?task.assignee:(filter!=='All'?filter:'Arun');
  $('f-points').value=task?task.points:10;$('f-date').value=task?task.date:today();$('f-time').value=task?task.time:'09:00';
  $('form-card').classList.remove('hidden');$('form-card').scrollIntoView({behavior:'smooth',block:'start'});$('f-title').focus()}
function closeForm(){editingId=null;$('form-card').classList.add('hidden');$('task-form').reset()}
$('task-form').addEventListener('submit',e=>{e.preventDefault();
  const title=$('f-title').value.trim(),points=Math.floor(Number($('f-points').value)),date=$('f-date').value||today(),time=$('f-time').value||'09:00',assignee=$('f-assignee').value;
  if(!title||!(points>=1)){msg('Enter a task name and a star value of at least 1.');return}
  if(editingId){const t=state.tasks[editingId];if(!t)return closeForm();const was=t.completed;if(was)refund(t);Object.assign(t,{title,points,date,time,assignee});if(was)award(t);msg(`Updated “${title}”.`)}
  else{state.tasks['task-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)]={title,points,date,time,assignee,completed:false};msg(`Added “${title}” for ${assignee}.`)}
  save();closeForm();render()});
$('f-cancel').onclick=closeForm;
$('add-task').onclick=()=>openForm();

// UPDATE (complete) / DELETE
function toggle(id,checked){const t=state.tasks[id];if(!t)return;if(checked&&!t.completed){t.completed=true;award(t);msg(`${t.assignee} earned ${t.awarded.stars} stars.`)}else if(!checked&&t.completed){refund(t);t.completed=false;msg('Task reopened; stars removed.')}save();render()}
function del(id){const t=state.tasks[id];if(!t||!confirm(`Delete “${t.title}”?`))return;if(t.completed)refund(t);delete state.tasks[id];if(editingId===id)closeForm();save();msg(`Deleted “${t.title}”.`);render()}

// READ
function fmtDate(d){const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function fmtTime(t){const x=new Date('1970-01-01T'+t);return isNaN(x)?t:x.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function renderFilters(){const box=$('filters');box.replaceChildren();['All',...MEMBERS.map(m=>m.name)].forEach(n=>{const b=document.createElement('button');b.type='button';b.className='chip'+(n===filter?' on':'');if(n!=='All')b.style.cssText=mstyle(n);b.textContent=n;b.setAttribute('aria-pressed',String(n===filter));b.onclick=()=>{filter=n;render()};box.append(b)})}
function render(){
  ensure();renderFilters();
  const list=$('task-list');list.replaceChildren();
  const tasks=Object.entries(state.tasks).map(([id,t])=>({id,...t})).filter(t=>filter==='All'||t.assignee===filter)
    .sort((a,b)=>(a.completed-b.completed)||`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
  const done=tasks.filter(t=>t.completed).length;
  $('progress-bar').style.width=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
  $('progress-label').textContent=`${done} of ${tasks.length} tasks complete`;
  if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet. Tap “+ Add task” to create one.</div>';return}
  const now=new Date();
  tasks.forEach(t=>{
    const late=!t.completed&&new Date(`${t.date}T${t.time||'23:59'}`)<now;
    const row=document.createElement('div');row.className='task'+(t.completed?' done':'');row.style.cssText=mstyle(t.assignee);
    row.innerHTML=`<input type="checkbox" ${t.completed?'checked':''} aria-label="Mark ${esc(t.title)} complete"><div class="tmain"><div class="ttitle">${esc(t.title)}</div><div class="tmeta"><span class="who">${esc(t.assignee)}</span> · ${esc(fmtDate(t.date))}, ${esc(fmtTime(t.time))}${late?' · <span class="late">Overdue</span>':''}</div></div><span class="tstars">★ ${Number(t.points)||1}</span><button type="button" class="pill edit" aria-label="Edit ${esc(t.title)}">✎</button><button type="button" class="pill del" aria-label="Delete ${esc(t.title)}">🗑</button>`;
    row.querySelector('input').onchange=e=>toggle(t.id,e.target.checked);
    row.querySelector('.edit').onclick=()=>openForm(t);
    row.querySelector('.del').onclick=()=>del(t.id);
    list.append(row)})}

MEMBERS.forEach(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;$('f-assignee').append(o)});
try{if(localStorage.getItem('family-dashboard-theme')==='dark')document.body.classList.add('dark')}catch(e){}
$('theme').onclick=()=>{const d=document.body.classList.toggle('dark');try{localStorage.setItem('family-dashboard-theme',d?'dark':'light')}catch(e){}};
const resync=()=>{if($('form-card').classList.contains('hidden')){state=readState();render()}};
window.addEventListener('storage',e=>{if(e.key===KEY)resync()});window.addEventListener('focus',resync);
render();
</script>
</body>
</html>
